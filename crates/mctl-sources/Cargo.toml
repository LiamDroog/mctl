[package]
name = "mctl-sources"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
mctl-astro = { version = "0.0.0", path = "../mctl-astro" }
mctl-core = { version = "0.0.0", path = "../mctl-core" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
ureq = "3"
webpki-roots = "0.26"
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy"] }
