[package]
name = "mctl-gui"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The mctl console: renderer, pages, themes and the Raspberry Pi display"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37.0", default-features = false }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
mctl-astro = { version = "0.1.1", path = "../mctl-astro" }
mctl-core = { version = "0.1.1", path = "../mctl-core" }
mctl-sim = { version = "0.1.1", path = "../mctl-sim" }
mctl-sources = { version = "0.1.1", path = "../mctl-sources" }
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
wgpu = "30.0.1"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }

[dev-dependencies]
proptest = "1"
