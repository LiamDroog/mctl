[workspace]
resolver = "3"
members = [
    ".",
    "crates/*",
    "spikes/*",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "mctl"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Fast incremental rebuilds matter more than the last few percent: `mctl-gfx` rebuilds on launch.
[profile.release]
incremental = true
debug = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
mctl-core = { version = "0.0.0", path = "crates/mctl-core" }
mctl-gui = { version = "0.0.0", path = "crates/mctl-gui" }
mctl-store = { path = "crates/mctl-store" }
mctl-sim = { version = "0.0.0", path = "crates/mctl-sim" }
mctl-sources = { version = "0.0.0", path = "crates/mctl-sources" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
