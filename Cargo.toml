[workspace]
resolver = "3"
members = [
    ".",
    "crates/*",
    "spikes/*",
]
# What a plain `cargo build` or `cargo test` covers: the program, not the early prototypes. The `astro` prototype
# needs libclang to build, which a clean machine does not have.
default-members = [
    ".",
    "crates/*",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/LiamDroog/mctl"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Errors are handled, not unwrapped; `expect` is for invariants and says which. Tests are exempt (clippy.toml).
unwrap_used = "deny"

[package]
name = "mctl"
description = "Mission-control style display for the ISS and the spacecraft around it"
readme = "README.md"
keywords = ["iss", "orbit", "satellite", "tracker", "mission-control"]
categories = ["science", "visualization"]
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Fast incremental rebuilds matter more than the last few percent: `mctl-gfx` rebuilds on launch.
[profile.release]
incremental = true
debug = false

# What the release workflow builds (packaging/make-dist.sh): smaller and a little faster, but slow to compile.
[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
codegen-units = 4
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
mctl-core = { version = "0.0.0", path = "crates/mctl-core" }
mctl-gui = { version = "0.0.0", path = "crates/mctl-gui" }
mctl-store = { path = "crates/mctl-store" }
mctl-sim = { version = "0.0.0", path = "crates/mctl-sim" }
mctl-sources = { version = "0.0.0", path = "crates/mctl-sources" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
