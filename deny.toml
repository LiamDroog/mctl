# cargo-deny configuration: `cargo deny check`. Run in CI (see .github/workflows/ci.yml).
# mctl is GPL-3.0-or-later; every licence below is compatible with that.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry needs a reason; review these when upgrading dependencies.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "`paste` is unmaintained, not vulnerable. It is a compile-time macro crate pulled in by ode_solvers -> nalgebra -> simba, and there is no upgrade path until simba moves off it." },
]

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",   # this workspace
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",             # file-level copyleft; compatible with the GPL, and we do not modify these crates
    "CDLA-Permissive-2.0", # webpki-roots
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # path dependencies inside the workspace

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
