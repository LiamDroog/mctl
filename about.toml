# cargo-about configuration: `tools/gen-notices.sh` writes THIRD-PARTY-NOTICES.md from this.
accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# The workspace's own crates are `publish = false`; they are mctl itself, not third-party.
private = { ignore = true }
ignore-dev-dependencies = true
ignore-build-dependencies = false
