# Spike C configuration. Nothing here is hardcoded in the binary.
# Server, adapter set, field names and the TIME item come from ISS Mimic's own client
# (github.com/ISS-Mimic/Mimic, Pi/iss_telemetry.py, MIT licence). Item IDs and their meanings come
# from Mimic's Telemetry/ISS_Public_Telemetry.xlsx. `description` is that spreadsheet's text, verbatim;
# `units` is its UNITS column. Both are *documentation*, not verified: see docs/adr/0002.

[server]
url = "wss://push.lightstreamer.com/lightstreamer"   # Mimic: LightstreamerClient("https://push.lightstreamer.com", "ISSLIVE")
adapter_set = "ISSLIVE"

[run]
duration_s = 120          # how long to stay connected
connect_timeout_s = 15    # TCP + TLS + WebSocket + CONOK
setup_timeout_s = 15      # CONOK -> every SUBOK
stall_factor = 3.0        # fail if nothing (not even PROBE) arrives for keepalive * this

[fields]
# Mimic's main subscription uses these two fields; the TIME item adds the two status fields.
data = ["TimeStamp", "Value"]
time = ["TimeStamp", "Value", "Status.Class", "Status.Indicator"]

[time_item]
id = "TIME_000001"

# `label` is a short display name derived from `description` by abbreviation only. `units` is the
# spreadsheet's UNITS column, EXCEPT USLAB000022-27, which it labels RAD and RAD/S but whose live values
# are deg and deg/s, and the cabin pressure/partial-pressure items (labelled PSI/PSIA) whose values are
# mmHg and the cabin temperature (labelled CNT), which is degC. Evidence: docs/step3/attitude-verification.md.

