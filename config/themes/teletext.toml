# Ceefax and Oracle: seven saturated colours on black.
name = "Teletext"

[font]
family = "unscii"
size_px = 24.0
cell_w_px = 12.0
cell_h_px = 24.0

[palette]
background = "#000000"
foreground = "#ffffff"
dim = "#8a8a8a"
bright = "#ffff00"
border = "#00ffff"
nominal = "#00ff00"
caution = "#ffff00"
warning = "#ff0000"
info = "#00ffff"

[limit.caution]
inverse = false
blink_hz = 0.0
dim = false
semantic_colour = true
[limit.warning]
inverse = false
blink_hz = 2.0
dim = false
semantic_colour = true
[limit.stale]
inverse = false
blink_hz = 0.0
dim = true
semantic_colour = false

[effects.scanlines]
enabled = true
strength = 0.15
period_px = 4.0
[effects.bloom]
enabled = false
threshold = 0.45
intensity = 0.0
radius_px = 6.0
[effects.persistence]
enabled = false
decay = 0.0
[effects.curvature]
enabled = false
amount = 0.0
vignette = 0.1

[globe]
mode = "colour"
day_tint = "#ffffff"
night_tint = "#10102a"
graticule = "#00ffff"
coast = "#ffff00"
orbit = "#ff00ff"
vehicle = "#ffffff"
ambient = 0.06
terminator_softness = 0.12
