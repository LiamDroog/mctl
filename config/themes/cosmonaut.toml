# Soviet control room: red and amber on near-black.
name = "Cosmonaut"

[font]
family = "unscii"
size_px = 24.0
cell_w_px = 12.0
cell_h_px = 24.0

[palette]
background = "#120403"
foreground = "#ff4a2a"
dim = "#8a2a18"
bright = "#ffd0c0"
border = "#d63a1c"
nominal = "#ffb347"
caution = "#ffd23a"
warning = "#ffffff"
info = "#ff4a2a"

[limit.caution]
inverse = true
blink_hz = 0.0
dim = false
semantic_colour = false
[limit.warning]
inverse = true
blink_hz = 2.0
dim = false
semantic_colour = false
[limit.stale]
inverse = false
blink_hz = 0.0
dim = true
semantic_colour = false

[effects.scanlines]
enabled = true
strength = 0.3
period_px = 4.0
[effects.bloom]
enabled = true
threshold = 0.45
intensity = 0.9
radius_px = 6.0
[effects.persistence]
enabled = true
decay = 0.84
[effects.curvature]
enabled = true
amount = 0.035
vignette = 0.45

[globe]
mode = "mono"
day_tint = "#ff6a42"
night_tint = "#3a0f08"
graticule = "#8a2a18"
coast = "#ffd0c0"
orbit = "#ffb347"
vehicle = "#ffffff"
ambient = 0.06
terminator_softness = 0.12
