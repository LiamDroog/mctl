# The Raspberry Pi / Commodore 1702 display (`mctl --pi`). Not in the T-key cycle: the CRT does the
# scanlines, glow and curvature, so every effect here is off. Colours are saturated and few, since
# composite video smears fine detail and desaturates dark colours.
name = "CRT"
flat = true

[font]
family = "unscii"   # an 8 px bitmap font drawn at 3x: crisp on a 15 kHz tube
size_px = 24.0         # advance is exactly 12 px: 0.5 em
cell_w_px = 12.0
cell_h_px = 24.0

[palette]
background = "#000000"
foreground = "#58d8ff"
dim = "#3a8aaa"
bright = "#ffffff"
border = "#2f9cc4"
nominal = "#58ff90"
caution = "#ffd23c"
warning = "#ff503c"
info = "#58d8ff"

[limit.caution]
inverse = false
blink_hz = 0.0
dim = false
semantic_colour = true
[limit.warning]
inverse = true
blink_hz = 2.0
dim = false
semantic_colour = true
[limit.stale]
inverse = false
blink_hz = 0.0
dim = true
semantic_colour = true

[effects.scanlines]
enabled = false
strength = 0.0
period_px = 4.0
[effects.bloom]
enabled = false
threshold = 0.5
intensity = 0.0
radius_px = 0.0
[effects.persistence]
enabled = false
decay = 0.0
[effects.curvature]
enabled = false
amount = 0.0
vignette = 0.0

[globe]
mode = "colour"
day_tint = "#58d8ff"
night_tint = "#0a2a3a"
graticule = "#2f9cc4"
coast = "#ffffff"
orbit = "#ffd23c"
vehicle = "#ffffff"
ambient = 0.08
terminator_softness = 0.12
