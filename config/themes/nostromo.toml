# Alien (1979) ship's computer: cold teal with an orange alarm.
name = "Nostromo"

[font]
family = "unscii"
size_px = 24.0
cell_w_px = 12.0
cell_h_px = 24.0

[palette]
background = "#0a0f10"
foreground = "#9fd8cf"
dim = "#4c7a74"
bright = "#eafffb"
border = "#5fb3a8"
nominal = "#9fd8cf"
caution = "#ffb84d"
warning = "#ff4d3a"
info = "#5fb3a8"

[limit.caution]
inverse = true
blink_hz = 0.0
dim = false
semantic_colour = false
[limit.warning]
inverse = true
blink_hz = 2.0
dim = false
semantic_colour = false
[limit.stale]
inverse = false
blink_hz = 0.0
dim = true
semantic_colour = false

[effects.scanlines]
enabled = true
strength = 0.3
period_px = 4.0
[effects.bloom]
enabled = true
threshold = 0.45
intensity = 0.9
radius_px = 6.0
[effects.persistence]
enabled = true
decay = 0.8
[effects.curvature]
enabled = true
amount = 0.045
vignette = 0.5

[globe]
mode = "mono"
day_tint = "#9fd8cf"
night_tint = "#0c2220"
graticule = "#3c6b64"
coast = "#eafffb"
orbit = "#ffb84d"
vehicle = "#ffffff"
ambient = 0.06
terminator_softness = 0.12
