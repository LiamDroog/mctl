# Deep purple with magenta/cyan accents; bloom, no scanlines/persistence.
# The optional horizon-grid backdrop is NOT implemented in the M0 spike.
name = "Retrowave"

[font]
family = "unscii"
size_px = 32.0
cell_w_px = 16.0
cell_h_px = 32.0

[palette]
background = "#12002b"
foreground = "#e8c7ff"
dim = "#7a4fa8"
bright = "#ffffff"
border = "#ff2fd6"
nominal = "#2ff3ff"
caution = "#ffd23f"
warning = "#ff3b6b"
info = "#2ff3ff"

[limit.caution]
inverse = false
blink_hz = 0.0
dim = false
semantic_colour = true
[limit.warning]
inverse = false
blink_hz = 2.0
dim = false
semantic_colour = true
[limit.stale]
inverse = false
blink_hz = 0.0
dim = true
semantic_colour = false

[effects.scanlines]
enabled = false
strength = 0.0
period_px = 4.0
[effects.bloom]
enabled = true
threshold = 0.4
intensity = 1.1
radius_px = 8.0
[effects.persistence]
enabled = false
decay = 0.0
[effects.curvature]
enabled = false
amount = 0.0
vignette = 0.2

[globe]
mode = "colour"
day_tint = "#ffc9f4"
night_tint = "#1a0540"
graticule = "#2ff3ff"
coast = "#ff2fd6"
orbit = "#2ff3ff"
vehicle = "#ffffff"
ambient = 0.05
terminator_softness = 0.14
